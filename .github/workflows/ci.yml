name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, formatação, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Variáveis de ambiente de exemplo
        run: cp .env.example .env

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
